name: attendance_system
description: "NIT Goa - Attendance & Course Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.7
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  file_picker: ^11.0.3
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.5.0
  csv: ^6.0.0
  path_provider: ^2.1.5

  # Networking & Authentication
  http: ^1.2.2
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1
  firebase_core: ^5.1.0
  url_launcher: ^6.3.2
  firebase_auth: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
